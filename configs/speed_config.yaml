# configs/speed_config.yaml
# Speed estimation & dynamic object config
# 速度估计与动态目标相关配置

model:
  weights: "./weights/yolo11l-visdrone.pt"       # YOLO model weights path / YOLO 模型权重路径
  imgsz: 960                                     # Inference image size / 推理输入尺寸
  device: 0                                      # GPU device id (or 'cpu') / GPU 设备编号（或 'cpu'）

tracking:
  tracker_cfg: "./configs/trackers/botsort.yaml"  # Tracker config path / 跟踪器配置文件路径
  conf: 0.3                                       # Detection confidence threshold / 检测置信度阈值

dynamic_classes:
  # Class names treated as dynamic vehicles.
  # 会被视为“动态车辆”的类别名称（基于 model.names 的名字）。
  # 对于 COCO 预训练，通常包括：
  # - car, bus, truck, motorcycle, bicycle
  names:
    - car
    - van
    - truck
    - bus

  # If you prefer to specify by id, you can fill this after printing model.names.
  # 如果你更习惯按 id 指定，可以在打印 model.names 后填写这里。
  ids: []   # e.g. [2, 3, 5, 7]

speed:
  # Approximate car length (meters) / 近似车辆长度（米）
  # 之前是单一 car_length_m，这里改为“默认长度 + 按类别长度覆盖”。
  default_length_m: 5.0

  # Per-class approximate vehicle lengths (meters)
  # 按类别设置的车辆近似长度（米），键名需与 model.names 中的类别名称一致。
  # 下面是一个典型设置（可根据你自己的数据集/场景微调）：
  # - car   ~ 4.5 m  : 小轿车
  # - van   ~ 5.0 m  : 面包车/厢式车
  # - truck ~ 9.0 m  : 中型卡车（轻卡 6–7 m，重卡 12–13 m，这里取中等偏上）
  # - bus   ~ 11.0 m : 城市公交车
  class_length_m:
    car: 4.8
    van: 5.0
    truck: 9.0
    bus: 11.0

  ema_alpha_mpp: 0.30       # EMA factor for meters-per-pixel / 像素-米比例的指数平滑系数
  ema_alpha_speed: 0.60     # EMA factor for speed / 速度的指数平滑系数
  min_mpp: 0.005            # Lower bound of meters-per-pixel / 像素-米比例下界
  max_mpp: 0.5              # Upper bound / 上界
  max_speed_mps: 60.0       # Clamp speed (m/s) to filter outliers / 速度上限（米/秒），用于剔除离群值

static_detection:
  d_static_px: 2.5          # Distance threshold for static hypothesis / 静止判定的位移阈值
  d_moving_px: 5.0          # Distance threshold for moving hypothesis / 运动判定的位移阈值
  r_static_mean: 12.0       # Residual mean threshold for static / 亮度残差静止阈值
  r_moving_mean: 25.0       # Residual mean threshold for moving / 亮度残差运动阈值
  k_static: 6               # Hysteresis: frames to confirm static / 迟滞：连续多少帧判定为静止
  k_moving: 2               # Hysteresis: frames to confirm moving / 迟滞：连续多少帧判定为运动

weighted_speed:
  enabled: false          # Enable confidence-weighted speed smoothing / 启用“置信度加权”的速度平滑（建议先保持 false）

  # --- bbox size consistency weight (w_bbox) / bbox 尺度一致性权重（w_bbox）---
  # We maintain a per-track EMA reference size s_ref, and down-weight when current bbox size deviates.
  # 为每个 track 维护 bbox 尺度的 EMA 参考值 s_ref，当前 bbox 尺度偏离越大，权重越小。
  bbox:
    rho_size: 0.93        # EMA factor for bbox size reference / bbox 尺度参考的 EMA 系数（越大越稳）
    sigma_bbox: 0.25      # Sensitivity of bbox deviation mapping / 尺度偏离映射的敏感度（越小越敏感）
    w_min_bbox: 0.30      # Minimum bbox weight floor / bbox 权重下限（避免卡死）

  # --- speed jump gating (w_deltaV) / 速度跳变门控权重（w_deltaV）---
  # ΔVmax = dv_a + dv_b * V_smooth(km/h); larger dv => smaller weight.
  # 允许的最大速度跳变：ΔVmax = dv_a + dv_b * V_smooth(km/h)；跳变越大，权重越小。
  deltaV:
    p: 3.0                # Soft-gating exponent (larger -> harder) / 软门控指数（越大越“硬”）
    w_min_dv: 0.25        # Minimum deltaV weight floor / 跳变门控权重下限（避免一直只看历史）
    dv_a: 10.0            # ΔVmax constant term (km/h) / ΔVmax 的固定项（km/h）
    dv_b: 0.15            # ΔVmax proportional term / ΔVmax 的比例项（随速度增大）

  # --- image border weight (w_edge) / 图像边缘权重（w_edge）---
  # Down-weight near borders since homography/boxes tend to be unstable there.
  # 靠近图像边缘时更容易不稳定（单应/框抖动），因此降低权重。
  edge:
    edge_ratio: 0.10      # Border band ratio of min(W,H) / 边缘带宽比例（相对 min(W,H)）
    w_min_edge: 0.40      # Minimum edge weight floor / 边缘权重下限

  # --- total weight smoothing / 总权重平滑（W 的 EMA）---
  # W_raw = w_bbox * w_homo * w_deltaV * w_edge, then apply EMA to W for stability.
  # 先合成 W_raw = w_bbox * w_homo * w_deltaV * w_edge，再对 W 做 EMA 使其更稳定。
  weight_smooth:
    eta_w: 0.90           # EMA factor for total W / 总权重 W 的 EMA 系数（越大越稳）
    W_floor: 0.10         # Minimum total weight floor / 总权重下限（防止“卡死”）

  eps: 1e-6               # Small epsilon to avoid division by zero / 数值稳定项（避免除零）
